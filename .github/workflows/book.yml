name: deploy-book

# Only run this when the main branch changes
on:
  push:
    branches:
    - main

# This job installs dependencies, build the book, and pushes it to `gh-pages`
jobs:
  deploy-book:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    # Install dependencies
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: 3.11

    - name: Install dependencies
      run: |
        pip install -r requirements.txt

    # Regenerate the Code API docs before the HTML build, so the freshly
    # generated docs/enclose.html is what the book's html_extra_path picks
    # up (the book build copies docs/ as it runs, not afterward).
    - name: Generate Code API docs
      run: |
        pdoc --math ./notebooks/enclose.py -o ./docs

    # Build the book
    - name: Build the book
      run: |
        jupyter-book build .

    # Push the book's HTML to github-pages. Runs right after the HTML
    # build so the (separate, best-effort) PDF build below can never
    # block deployment.
    - name: GitHub Pages action
      uses: peaceiris/actions-gh-pages@v3.9.0
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./_build/html

    # Install LaTeX dependencies for PDF build
    - name: Install LaTeX
      run: |
        sudo apt-get update
        sudo apt-get install -y texlive-xetex texlive-fonts-recommended texlive-plain-generic texlive-fonts-extra latexmk

    # Best-effort PDF build. continue-on-error: true because this has a
    # pre-existing LaTeX/pgfplots compatibility issue (see git history:
    # "missing style for pdf build", "another try at fixing PDF build")
    # that is tracked separately and should not block HTML deployment.
    - name: Build PDF
      continue-on-error: true
      run: |
        jupyter-book build . --builder pdflatex
